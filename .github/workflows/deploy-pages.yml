name: Deploy Governance Commons site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - run: npm ci
      - name: Validate Observatory catalog and navigation
        id: observatory
        run: npm run verify:observatory
      - name: Validate Observatory evidence publication gate
        run: npm run verify:observatory:evidence
      - name: Verify public claims consistency
        run: npm run verify:public-claims
      - name: Build site
        id: site_build
        run: npm run build
      - name: Verify internal navigation and anchors
        run: npm run verify:navigation
      - name: Verify publication artifacts
        id: publication
        run: npm run verify:publication
      - name: Publish QA summary
        if: always()
        env:
          OBSERVATORY: ${{ steps.observatory.outcome }}
          BUILD: ${{ steps.site_build.outcome }}
          PUBLICATION: ${{ steps.publication.outcome }}
        run: |
          echo "## Governance Commons build checks" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Observatory structural validation | $OBSERVATORY |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Astro site build | $BUILD |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Publication artifact verification | $PUBLICATION |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "These checks do not establish external source accuracy or independent AI system evaluation." >> "$GITHUB_STEP_SUMMARY"
      - name: Generate build-to-live digest evidence
        run: node scripts/publication-fidelity.mjs generate
      - name: Retain build manifest for post-deploy comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gc-zt-11-build-manifest
          path: fidelity-evidence/build-manifest.json
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  verify-production:
    name: Verify published website
    permissions:
      contents: read
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Verify live content after Pages deployment
        id: live
        shell: bash
        run: |
          # Retry briefly because the Pages edge may not expose the new artifact immediately.
          for attempt in 1 2 3 4 5; do
            echo "Production verification attempt $attempt of 5"
            if node scripts/verify-live-publication.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 15; fi
          done
          exit 1
      - name: Retrieve manifest generated by the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gc-zt-11-build-manifest
          path: fidelity-evidence
      - name: Observe build-to-live byte fidelity
        continue-on-error: true
        run: node scripts/publication-fidelity.mjs verify
      - name: Preserve observed live fidelity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gc-zt-11-live-fidelity-evidence
          path: fidelity-evidence/live-comparison.json
          if-no-files-found: warn
      - name: Upload live verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: post-deploy-live-verification
          path: live-publication-report.json
          if-no-files-found: warn
