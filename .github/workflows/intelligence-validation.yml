name: Intelligence editorial validation
on:
  pull_request:
    paths:
      - 'scripts/intelligence/**'
      - 'content/intelligence/**'
      - 'site/src/pages/intelligence/**'
      - '.github/workflows/intelligence-*.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:intelligence
      - run: npm run build
      - run: npm run verify:publication
