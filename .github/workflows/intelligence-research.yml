name: Intelligence research candidates
on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:intelligence
      - run: npm run intelligence:discover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intelligence-research-candidates
          path: research/intelligence/candidates.json
          if-no-files-found: warn
          retention-days: 14
