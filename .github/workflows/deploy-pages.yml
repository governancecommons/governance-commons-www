name: Deploy Governance Commons site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - run: npm ci
      - name: Validate Observatory catalog and navigation
        id: observatory
        run: npm run verify:observatory
      - name: Validate Observatory evidence publication gate
        run: npm run verify:observatory:evidence
      - name: Build site
        id: site_build
        run: npm run build
      - name: Verify publication artifacts
        id: publication
        run: npm run verify:publication
      - name: Publish QA summary
        if: always()
        env:
          OBSERVATORY: ${{ steps.observatory.outcome }}
          BUILD: ${{ steps.site_build.outcome }}
          PUBLICATION: ${{ steps.publication.outcome }}
        run: |
          echo "## Governance Commons build checks" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Observatory structural validation | $OBSERVATORY |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Astro site build | $BUILD |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Publication artifact verification | $PUBLICATION |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "These checks do not establish external source accuracy or independent AI system evaluation." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614e5
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db901f4f0f6d9a2b92b5ac3e59d9a0d29e8a72
