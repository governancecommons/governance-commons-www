name: Collect RFC-0001 G-1 evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g1-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Collect canonical schema, DNS and TLS observations
        run: node scripts/verify-g1-evidence.mjs
      - name: Preserve time-stamped evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfc0001-g1-evidence
          path: g1-publication-evidence.json
          if-no-files-found: warn
