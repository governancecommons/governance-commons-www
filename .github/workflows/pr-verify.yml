name: Website pull request verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Observatory catalog
        run: npm run verify:observatory
      - name: Verify Observatory evidence gate
        run: npm run verify:observatory:evidence
      - name: Build static site
        run: npm run build
      - name: Verify publication artifacts
        run: npm run verify:publication
