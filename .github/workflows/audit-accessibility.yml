name: Audit website accessibility and mobile layout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install isolated browser-audit dependencies
        run: npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build site
        run: npm run build
      - name: Start local production preview
        run: |
          npm run preview -- --port 4321 > /tmp/gc-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gc-preview.log
          exit 1
      - name: Audit routes and viewports
        run: node scripts/audit-accessibility.mjs
      - name: Upload screenshots and accessibility results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: www-18-browser-audit
          path: accessibility-evidence/
          if-no-files-found: warn
