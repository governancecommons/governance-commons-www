name: Collect RFC-0001 G-1 evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g1-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Collect canonical schema, DNS and TLS observations
        run: node scripts/verify-g1-evidence.mjs
      - name: Preserve time-stamped evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rfc0001-g1-evidence
          path: g1-publication-evidence.json
          if-no-files-found: warn
