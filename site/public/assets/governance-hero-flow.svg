<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">Inspectable AI governance lifecycle</title><desc id="desc">Agent identity, authority, coordination, evidence and human review, with naming across the system.</desc><rect width="1100" height="420" rx="28" fill="#f3f8fc"/><g font-family="Arial,sans-serif" text-anchor="middle"><g font-size="20" font-weight="bold" fill="#102840"><rect x="30" y="75" width="190" height="165" rx="17" fill="#dceeff" stroke="#4c9ddd"/><text x="125" y="135">Identity</text><rect x="242" y="75" width="190" height="165" rx="17" fill="#ddf4eb" stroke="#399c7d"/><text x="337" y="135">Authority</text><rect x="454" y="75" width="190" height="165" rx="17" fill="#eee6fc" stroke="#8e72c5"/><text x="549" y="135">Coordination</text><rect x="666" y="75" width="190" height="165" rx="17" fill="#fff1d8" stroke="#cf962e"/><text x="761" y="135">Evidence</text><rect x="878" y="75" width="190" height="165" rx="17" fill="#e5edf5" stroke="#829bb5"/><text x="973" y="135">Human review</text></g><g font-size="14" fill="#34495d"><text x="125" y="170">Who is acting?</text><text x="337" y="170">Who permits it?</text><text x="549" y="170">How is work governed?</text><text x="761" y="170">What can be checked?</text><text x="973" y="170">Oversight and recourse</text></g><g stroke="#3a719c" stroke-width="3" fill="none"><path d="M220 155h20m-8 -7l8 7 -8 7M432 155h20m-8 -7l8 7 -8 7M644 155h20m-8 -7l8 7 -8 7M856 155h20m-8 -7l8 7 -8 7"/></g><rect x="30" y="286" width="1038" height="77" rx="14" fill="#d5edfa" stroke="#66add5"/><text x="549" y="318" font-size="20" font-weight="bold" fill="#123b61">Ontic Namespace Structure (ONS)</text><text x="549" y="342" font-size="15" fill="#325571">Naming structure across the system</text></g></svg>