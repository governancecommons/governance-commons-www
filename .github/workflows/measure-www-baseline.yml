name: Measure website performance and security baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Collect read-only HTTP/TLS-facing security header observations
        run: node scripts/measure-www-baseline.mjs
      - name: Install Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: stable
      - name: Run Lighthouse against production homepage
        continue-on-error: true
        run: |
          npx --yes lighthouse@12.8.2 https://governancecommons.org/ \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=baseline-evidence/lighthouse-home.json \
            --quiet
      - name: Extract Lighthouse scores when available
        if: always()
        run: |
          node -e 'const fs=require("node:fs");const p="baseline-evidence/lighthouse-home.json"; if (!fs.existsSync(p)) {console.log("No Lighthouse JSON collected; check tool logs");process.exit(0)} const j=JSON.parse(fs.readFileSync(p)); for (const [key,val] of Object.entries(j.categories||{})) {console.log(key+": "+Math.round((val.score??0)*100));} if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"\\nLighthouse scores are in the retained JSON artifact. These are lab measurements, not field Core Web Vitals or compliance certification.\\n");'
      - name: Preserve baseline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: www-22-performance-security-baseline
          path: baseline-evidence/
          if-no-files-found: warn
