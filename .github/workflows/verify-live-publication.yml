name: Verify live Governance Commons publication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Display runner DNS resolution
        run: |
          getent ahosts governancecommons.org || true
      - name: Verify public URLs, TLS, and canonical schemas
        id: verify
        run: node scripts/verify-live-publication.mjs
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-publication-evidence
          path: live-publication-report.json
          if-no-files-found: warn
